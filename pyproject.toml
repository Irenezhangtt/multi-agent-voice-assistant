[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-voice-agent"
version = "0.1.0"
description = "Claude + LangGraph clinic voice agent, local foundation"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1,<2",
  "langchain-anthropic>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=2,<5",
  "langsmith>=0.4,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-dotenv>=1,<2",
  "websockets>=15,<18",
  "mcp>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
voice-agent = "voice_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["voice_agent*", "evals*"]

[tool.setuptools.package-data]
voice_agent = ["static/*", "knowledge/*.json", "prompts/*.md"]
evals = ["dataset.json", "prompts/*.md", "tau/*.json", "tau-upstream.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
