name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_MODE: mock
      LANGSMITH_TRACING: "false"
      LITELLM_LOCAL_MODEL_COST_MAP: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Test runtime, business state, and evaluation boundaries
        run: python -m pytest -q
      - name: Check browser audio code
        run: |
          node --check voice_agent/static/voice.js
          node tests/check_audio_worklet.cjs
